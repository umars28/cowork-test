name: AI

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  workflow_dispatch:
  repository_dispatch:
    types: [ai-fix]
  issues:
    types: [labeled]

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/review.yml@main
    secrets: inherit

  build:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ai-build'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/build.yml@main
    secrets: inherit

  review_after_build:
    needs: build
    if: >-
      always() && needs.build.result == 'success'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/review.yml@main
    secrets: inherit

  nightly:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/nightly.yml@main
    secrets: inherit

  fix:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-review')
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: write
    uses: umars28/aiflow/.github/workflows/fix.yml@main
    with:
      issue: ${{ github.event.client_payload.issue || github.event.issue.number }}
    secrets: inherit
